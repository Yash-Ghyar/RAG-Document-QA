<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Response</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="startup-bg">

<div class="container startup-container">

    <div class="text-center mb-4">
        <h1 class="startup-title">AI Response</h1>
        <p class="startup-subtitle">Here is the best answer from your PDF</p>
    </div>

    <div class="startup-card p-4 mb-5">

        <p class="startup-label mb-1">Your Question</p>
        <div class="startup-question-box">
            {{ question }}
        </div>

        <p class="startup-label mt-4 mb-1">AI’s Answer</p>
        <div class="startup-answer-box">
            {{ answer }}
        </div>

        <a href="/" class="startup-btn w-100 mt-4">← Ask Another Question</a>

    </div>

</div>

</body>
</html>
